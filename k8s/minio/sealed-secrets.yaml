---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: minio-env
  namespace: minio
spec:
  encryptedData:
    MINIO_BROWSER: 
    MINIO_ROOT_PASSWORD: 
    MINIO_ROOT_USER: 
  template:
    metadata:
      name: minio-env
      namespace: minio
    type: Opaque
---
apiVersion: bitnami.com/v1alpha1
kind: SealedSecret
metadata:
  name: minio-tls
  namespace: minio
spec:
  encryptedData:
    tls.crt: 
    tls.key: 
  template:
    metadata:
      name: minio-tls
      namespace: minio
    type: kubernetes.io/tls
