apiVersion: v1 #service for pods to communicate with each other
kind: Service
metadata:
  name: postgres-headless
  namespace: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - name : postgres
      port : 5432
---
apiVersion: v1 #normal service
kind: Service
metadata:
  name: postgres
  namespace: postgres
spec:
  type: ClusterIP
  selector:
    app: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
