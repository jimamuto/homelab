apiVersion: v1
kind: Namespace
metadata:
  name: n8n
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: n8n
  namespace: n8n
  labels:
    app: n8n
spec:
  replicas: 1
  selector:
    matchLabels:
      app: n8n
  template:
    metadata:
      labels:
        app: n8n
    spec:
      containers:
        - name: n8n
          image: n8nio/n8n:latest
          ports:
            - name: http
              containerPort: 5678
          env:
            - name: N8N_HOST
              value: "n8n.fedora.tailf20727.ts.net"
            - name: N8N_PORT
              value: "5678"
            - name: N8N_PROTOCOL
              value: "https"
            - name: WEBHOOK_URL
              value: "https://n8n.fedora.tailf20727.ts.net"
            - name: N8N_SSL_KEY
              value: "/home/node/certs/private.key"
            - name: N8N_SSL_CERT
              value: "/home/node/certs/public.crt"
          readinessProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: 5678
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              scheme: HTTPS
              path: /
              port: 5678
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
            - name: n8n-certs
              mountPath: /home/node/certs
              readOnly: true
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-data
        - name: n8n-certs
          secret:
            secretName: n8n-tls
            items:
              - key: tls.crt
                path: public.crt
              - key: tls.key
                path: private.key